name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gates
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check first-party formatting
        run: >-
          cargo fmt
          --package codex-transport
          --package muse-codex
          --package muse-codex-gateway
          -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Build Apple silicon release binaries
        run: cargo build --workspace --release --locked --target aarch64-apple-darwin

      - name: Self-test release gateway
        run: ./target/aarch64-apple-darwin/release/muse-codex-gateway self-test

  release-tooling:
    name: Release tooling
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test signed release tooling
        run: bash tests/scripts/release-tooling-test.sh
