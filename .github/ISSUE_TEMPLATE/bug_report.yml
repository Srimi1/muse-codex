name: Bug report
description: Report a reproducible problem in Muse Codex
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Muse Codex. Remove credentials, prompt content,
        private-feed URLs, and proprietary Muse files from everything you share.

        For security vulnerabilities, stop here and use private vulnerability
        reporting instead.
  - type: input
    id: muse_codex_version
    attributes:
      label: Muse Codex version
      description: Provide a release version or `git rev-parse --short HEAD`.
      placeholder: 0.1.0 or abc1234
    validations:
      required: true
  - type: input
    id: muse_version
    attributes:
      label: Muse Code version
      description: Paste the output of `muse --version`.
      placeholder: Muse Code 1.0.3 (1.0.3-R2198.1)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System information
      description: Include macOS version and Mac model or CPU architecture.
      placeholder: macOS 15.x, Apple M-series, arm64
    validations:
      required: true
  - type: dropdown
    id: auth_mode
    attributes:
      label: Authentication mode
      options:
        - ChatGPT browser login
        - ChatGPT device authorization
        - OpenAI API key
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe, repeatable example.
      placeholder: |
        1. Run ...
        2. Enter ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Optional. Remove tokens, prompts, private URLs, usernames, and proprietary content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am using the exact supported Muse Code build.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed all secrets and sensitive content from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
