name: Feature request
description: Propose a focused improvement to Muse Codex
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Muse Codex deliberately preserves the stock Muse harness and changes only
        provider transport. Proposals should respect that boundary.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs did you consider?
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security impact
      description: Note effects on Muse versions, authentication, data flow, tool calls, or release integrity.
      placeholder: None, or describe the impact.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap.
          required: true
        - label: This request does not require redistributing or modifying the proprietary Muse binary.
          required: true
