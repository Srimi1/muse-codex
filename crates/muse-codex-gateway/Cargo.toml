[package]
name = "muse-codex-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Loopback compatibility gateway between Muse Code and OpenAI Codex"

[[bin]]
name = "muse-codex-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
codex-transport = { path = "../codex-transport" }
futures-util = "0.3"
getrandom = "0.3"
http = "1"
libc = "0.2"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
