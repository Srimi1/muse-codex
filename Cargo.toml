[workspace]
members = [
    "crates/codex-transport",
    "crates/muse-codex",
    "crates/muse-codex-gateway",
]
exclude = ["vendor/openai-codex/codex-rs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Srimi1/muse-codex"
homepage = "https://github.com/Srimi1/muse-codex"
rust-version = "1.95"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Required by the pinned Codex rust-v0.153.4 dependency graph. These are the
# exact revisions recorded by that upstream release.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
